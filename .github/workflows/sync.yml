name: Sync hostfiles

on:
  schedule:
    - cron: '17 0/4 * * *'
  workflow_dispatch:

concurrency:
  group: sync-hostfiles
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch from DVRef API
        env:
          TOKEN: ${{ secrets.DVREF_TOKEN }}
          DATA: ${{ runner.temp }}/dvref
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DVREF_TOKEN secret is not set." >&2
            exit 1
          fi
          mkdir -p "$DATA"
          # DVRef allows 60 authenticated requests/hour; one run uses 3 + (number of VEX servers).
          fetch() {
            curl --fail --show-error --silent \
              --retry 3 --retry-delay 30 --retry-all-errors \
              --max-time 60 \
              -H "Accept: application/json" \
              -H "Authorization: Token $TOKEN" \
              -H "User-Agent: M17-hostfiles/1.0 (+https://github.com/M17-Project/hostfiles)" \
              -o "$DATA/$1" \
              "https://dvref.com/api/v2/$2"
          }
          fetch mrefd.json mrefd/reflectors/
          fetch urfd.json  "urfd/reflectors/?mode=M17&resolve_ips=true"
          fetch vex.json   vex/servers/
          for slug in $(jq -r '.data.servers[].slug' "$DATA/vex.json"); do
            fetch "vex_${slug}.json" "vex/servers/${slug}/"
          done

      - name: Build hostfiles
        id: diff
        run: |
          python3 -I scripts/build_hostfiles.py "${{ runner.temp }}/dvref" .
          if [ -n "$(git status --porcelain -- M17Hosts.txt M17Hosts.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M17Hosts.txt M17Hosts.json
          files=$(git diff --cached --name-only | paste -sd, -)
          git commit -m "sync: ${files} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
