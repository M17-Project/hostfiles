name: Sync hostfiles

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-hostfiles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch M17_Hosts.txt
        run: |
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 60 \
            -o M17_Hosts.txt.new \
            https://www.pistar.uk/downloads/M17_Hosts.txt
          test -s M17_Hosts.txt.new

      - name: Replace if changed
        id: diff
        run: |
          if [ ! -f M17_Hosts.txt ] || ! cmp -s M17_Hosts.txt M17_Hosts.txt.new; then
            mv M17_Hosts.txt.new M17_Hosts.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            rm M17_Hosts.txt.new
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M17_Hosts.txt
          git commit -m "sync: M17_Hosts.txt $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
