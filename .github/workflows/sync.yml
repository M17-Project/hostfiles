name: Sync hostfiles

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-hostfiles
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch M17_Hosts.txt
        run: |
          touch .etag
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 60 \
            --etag-compare .etag --etag-save .etag \
            -o M17_Hosts.txt.new \
            https://www.pistar.uk/downloads/M17_Hosts.txt

      - name: Replace if changed
        id: diff
        run: |
          if [ ! -f M17_Hosts.txt.new ]; then
            echo "Upstream returned 304 Not Modified; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -s M17_Hosts.txt.new ]; then
            echo "Fetched file is empty; aborting." >&2
            exit 1
          fi
          if [ ! -f M17_Hosts.txt ] || ! cmp -s M17_Hosts.txt M17_Hosts.txt.new; then
            mv M17_Hosts.txt.new M17_Hosts.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            rm M17_Hosts.txt.new
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M17_Hosts.txt .etag
          git commit -m "sync: M17_Hosts.txt $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
