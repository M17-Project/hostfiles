name: Sync hostfiles

on:
  schedule:
    - cron: '17 0/4 * * *'
  workflow_dispatch:

concurrency:
  group: sync-hostfiles
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch hostfiles
        env:
          TOKEN: ${{ secrets.REFCHECK_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "REFCHECK_TOKEN secret is not set." >&2
            exit 1
          fi
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 60 \
            -H "Authorization: Token $TOKEN" \
            -o "M17Hosts.txt.new" \
            "https://refcheck.radio/api/hostfile-gate/fetch/m17/"
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 60 \
            -H "Authorization: Token $TOKEN" \
            -o "M17Hosts.json.new" \
            "https://refcheck.radio/api/hostfile-gate/fetch/json/m17/"

      - name: Replace if changed
        id: diff
        run: |
          for f in M17Hosts.txt M17Hosts.json; do
            if [ ! -s "$f.new" ]; then
              echo "$f: fetched file is empty; aborting." >&2
              exit 1
            fi
            if [ ! -f "$f" ] || ! cmp -s "$f" "$f.new"; then
              mv "$f.new" "$f"
            else
              rm "$f.new"
            fi
          done
          if [ -n "$(git status --porcelain -- M17Hosts.txt M17Hosts.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M17Hosts.txt M17Hosts.json
          files=$(git diff --cached --name-only | paste -sd, -)
          git commit -m "sync: ${files} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
